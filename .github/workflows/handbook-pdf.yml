name: Build downloadable handbook PDF
on:
  push:
    branches: [main]
    paths:
      - handbook.html
      - scripts/build_handbook_pdf.py
      - .github/workflows/handbook-pdf.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: pip install beautifulsoup4 reportlab
      - name: Build complete handbook
        run: python scripts/build_handbook_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Carved-in-Smoke-Handbook.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate downloadable handbook PDF"
            git push
          fi
